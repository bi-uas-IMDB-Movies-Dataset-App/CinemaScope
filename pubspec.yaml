name: cinemascope
description: "CinemaScope - Discover & Explore Top Movies (IMDB-style)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.2.1
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/cinemascope.png
    - assets/splash.png

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/splash.png
  android: true
  ios: true
  web: false
  fullscreen: true

